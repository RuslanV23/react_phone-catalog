<!doctype html>
<html lang="en" class="page">
  <head>
    <script>
      const root = document.documentElement;

      root.classList.add('no-theme-transition');

      let theme = 'light';

      try {
        theme = JSON.parse(localStorage.getItem('theme')) || 'light';
      } catch {
        theme = localStorage.getItem('theme') || 'light';
      }

      root.dataset.theme = theme === 'dark' ? 'dark' : 'light';

      window.addEventListener('load', () => {
        root.classList.remove('no-theme-transition');
      });
    </script>

    <meta charset="UTF-8" />
    <link rel="icon" href="/react_phone-catalog/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nice Gadgets!</title>
    <script type="module" crossorigin src="/react_phone-catalog/assets/index-DVu33kUS.js"></script>
    <link rel="stylesheet" crossorigin href="/react_phone-catalog/assets/index-C5aV-kwk.css">
  </head>
  <body class="page__body">
    <div id="root"></div>
  </body>
</html>
